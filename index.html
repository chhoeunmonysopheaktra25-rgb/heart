<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Do You Love Me? 💖</title>
  <!-- ទាញយក Library បាញ់កាំជ្រួច Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;700&family=Poppins:wght@600;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Kantumruy Pro', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* បេះដូងហោះៗនៅផ្ទៃខាងក្រោយ */
    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.6);
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      z-index: 0;
      user-select: none;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* ប្រអប់កញ្ចក់ (Glassmorphism Card) */
    .card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(214, 51, 108, 0.2);
      max-width: 90%;
      width: 450px;
      z-index: 10;
      transition: transform 0.3s ease;
    }

    .gif-box img {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    h1 {
      color: #d6336c;
      font-size: 2rem;
      margin-bottom: 25px;
      text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 60px;
    }

    button {
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      font-family: inherit;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #yes-btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      font-size: 18px;
      padding: 12px 32px;
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.4);
      z-index: 20;
    }

    #yes-btn:hover {
      transform: scale(1.08);
    }

    #no-btn {
      background-color: #ffffff;
      color: #ff416c;
      border: 2px solid #ff416c;
      font-size: 18px;
      padding: 12px 32px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    }

    .success-screen {
      display: none;
    }

    .success-screen h1 {
      font-size: 2.2rem;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }
  </style>
</head>
<body>

  <!-- ផ្ទាំងសំណួរ -->
  <div class="card" id="question-screen">
    <div class="gif-box">
      <img id="cute-gif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW5lenZyZHI5OXM2eW95b3pmMG40cWVrMDhtNjVuM3A4dGNxa2g5dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Cat">
    </div>
    <h1 id="question-text">Do you love me? 🥺💖</h1>
    
    <div class="buttons">
      <button id="yes-btn">Yes 😍</button>
      <button id="no-btn">No 😢</button>
    </div>
  </div>

  <!-- ផ្ទាំងជោគជ័យ -->
  <div class="card success-screen" id="success-screen">
    <div class="gif-box">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDNuZ2g2c3Z4bW50bXlxZ2Z4bW50bXlxZ2Z4bW50bXlxZ2Z4bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/T86i6yDyOYz7J6dPhf/giphy.gif" alt="Happy Love">
    </div>
    <h1>ដឹងតើថាស្រឡាញ់! 🥰❤️</h1>
    <p style="color: #666; font-size: 1.1rem; margin-top: 10px;">
      Love you to the moon and back! 🚀✨
    </p>
  </div>

  <script>
    const yesBtn = document.getElementById("yes-btn");
    const noBtn = document.getElementById("no-btn");
    const questionScreen = document.getElementById("question-screen");
    const successScreen = document.getElementById("success-screen");
    const cuteGif = document.getElementById("cute-gif");

    const noMessages = [
      "ប្រាកដអត់? 🤔",
      "គិតម្ដងទៀតមើល! 😢",
      "កុំចិត្តដាច់ពេក 😭",
      "ចុច Yes ទៅណា 🥺",
      "ខូចចិត្តឥឡូវហើយ 💔",
      "អត់ឱ្យចុច No ទេ! 😜"
    ];

    let msgIndex = 0;
    let yesFontSize = 18;
    let yesPadV = 12;
    let yesPadH = 32;
    let dodgeCount = 0;

    // ១. បង្កើតបេះដូងហោះៗនៅផ្ទៃខាងក្រោយ
    function createBgHearts() {
      const heart = document.createElement("div");
      heart.classList.add("bg-heart");
      heart.innerHTML = ["❤️", "💖", "💕", "🌸"][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createBgHearts, 400);

    // ២. មុខងារពេលដាក់ Mouse លើ No ឬចុច No
    function handleNoAction() {
      // ពង្រីកប៊ូតុង Yes
      yesFontSize += 10;
      yesPadV += 6;
      yesPadH += 14;
      yesBtn.style.fontSize = `${yesFontSize}px`;
      yesBtn.style.padding = `${yesPadV}px ${yesPadH}px`;

      // ប្ដូរពាក្យលើប៊ូតុង No និងប្ដូរ GIF ទៅជារូបយំ
      noBtn.textContent = noMessages[msgIndex];
      msgIndex = (msgIndex + 1) % noMessages.length;
      cuteGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaG50bXlxZ2Z4bW50bXlxZ2Z4bW50bXlxZ2Z4bW50bXlxZ2Z4bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/d2lcHJTG5Tscg/giphy.gif";

      // ធ្វើឱ្យប៊ូតុង No រត់គេចពេញអេក្រង់
      dodgeCount++;
      if (dodgeCount >= 2) {
        noBtn.style.position = "fixed";
        const maxX = window.innerWidth - noBtn.offsetWidth - 20;
        const maxY = window.innerHeight - noBtn.offsetHeight - 20;
        const randomX = Math.max(20, Math.floor(Math.random() * maxX));
        const randomY = Math.max(20, Math.floor(Math.random() * maxY));
        noBtn.style.left = `${randomX}px`;
        noBtn.style.top = `${randomY}px`;
      }
    }

    noBtn.addEventListener("click", handleNoAction);
    noBtn.addEventListener("mouseover", () => {
      if (dodgeCount >= 2) handleNoAction(); // ចាប់ពីលើកទី ២ ទៅ គ្រាន់តែដាក់ Mouse ជិតក៏រត់ដែរ
    });

    // ៣. ពេលចុច Yes -> បាញ់កាំជ្រួច Confetti
    yesBtn.addEventListener("click", () => {
      questionScreen.style.display = "none";
      successScreen.style.display = "block";

      // បាញ់ Confetti ៣ វិនាទី
      const end = Date.now() + 3000;
      (function frame() {
        confetti({
          particleCount: 6,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ff416c', '#ff4b2b', '#ff9a9e', '#ffffff']
        });
        confetti({
          particleCount: 6,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ff416c', '#ff4b2b', '#ff9a9e', '#ffffff']
        });
        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    });
  </script>

</body>
</html>
